name: Build finalpool

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-finalpool:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: finalpool
          fetch-depth: 0

      - name: Assemble implemented tasks into tasks/finalpool
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          python3 - <<'PY'
          import json, pathlib, re, shutil, subprocess

          # Tasks marked "implemented" in the Notion Task Tracker (as of this sync).
          implemented = json.loads('''["activity-logger", "alert-system", "analytics-dashboard", "asset-optimizer", "backup-utility", "blog-engine", "booking-system", "cache-optimizer", "calendar-sync", "canvas-automation", "canvas-grade-automation", "certificate-manager", "chat-bot", "client-portal", "cms-builder", "contact-manager", "content-manager", "content-scheduler", "coupon-manager", "crm-system", "customer-feedback-processor", "customer-portal", "data-analytics", "data-validator", "deal-manager", "deployment-tool", "discount-calculator", "email-campaign", "email-classification-system", "error-tracker", "expense-tracker", "feedback-collector", "file-manager", "follow-up-reminder", "form-builder", "health-monitor", "help-desk", "image-processor", "inventory-management", "invoice-generator", "load-balancer", "log-analyzer", "loyalty-program", "media-organizer", "monitoring-agent", "network-analyzer", "order-processor", "payment-processor", "pdf-report-generator", "permission-manager", "personalization-service", "price-tracker", "product-catalog", "qr-generator", "reminder-service", "robots-handler", "sales-pipeline", "scheduler", "search-engine", "security-scanner", "sentiment-analyzer", "shipment-tracker", "sitemap-generator", "social-connector", "social-publisher", "status-checker", "storage-manager", "streaming-service", "subtitle-generator", "survey-builder", "sync-service", "tag-manager", "task-scheduler", "template-engine", "territory-manager", "translation-api", "video-trimmer", "voice-processor", "web-crawler"]''')

          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()

          branches = [b.strip() for b in git('branch', '-r').splitlines()]
          branches = [b for b in branches if '->' not in b and not b.endswith('/main') and not b.endswith('/finalpool')]
          dest_root = pathlib.Path('tasks/finalpool')
          dest_root.mkdir(parents=True, exist_ok=True)

          for name in implemented:
              sources = []
              for branch in branches:
                  for devdir in git('ls-tree', '-d', '--name-only', branch, 'tasks/').splitlines():
                      candidate = f'{devdir}/{name}'
                      probe = subprocess.run(['git', 'cat-file', '-e', f'{branch}:{candidate}'],
                                             stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                      if probe.returncode == 0:
                          sources.append((branch, candidate))
              if len(sources) != 1:
                  raise SystemExit(f'Expected exactly one source for {name}, got {sources}')
              branch, source = sources[0]
              target = dest_root / name
              if target.exists():
                  shutil.rmtree(target)
              target.mkdir(parents=True)
              archive = subprocess.Popen(['git', 'archive', branch, source], stdout=subprocess.PIPE)
              subprocess.check_call(['tar', '-x', f'--strip-components=3', '-C', str(target)], stdin=archive.stdout)
              archive.stdout.close()
              if archive.wait() != 0:
                  raise SystemExit(f'archive failed for {name}')
              for doc in ('docs/agent_system_prompt.md', 'docs/task.md'):
                  text = (target / doc).read_text()
                  assert text.strip(), (name, doc, 'empty')
                  assert not re.search(r'[\u4e00-\u9fff]', text), (name, doc, 'non-English')
              print(f'{name}: {branch}:{source} -> {target} ({len(list(target.rglob("*")))} entries)')

          print(f'Total tasks in finalpool: {len(list(dest_root.iterdir()))}')
          PY

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "finalpool-sync"
          git config user.email "finalpool-sync@users.noreply.github.com"
          git add tasks/finalpool
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Add all implemented tasks from the Task Tracker to tasks/finalpool"
          git push origin HEAD:finalpool